apiVersion: v1
kind: ConfigMap
metadata:
  name: wiremock-mappings
  namespace: microservices-app
data:
  random-api.json: |
    {
      "request": {
        "method": "GET",
        "url": "/api/random"
      },
      "response": {
        "status": 200,
        "body": "{\"number\": {{randomInt}} }",
        "headers": {
          "Content-Type": "application/json"
        },
        "transformers": ["response-template"]
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: random-number-service
  namespace: microservices-app
spec:
  selector:
    app: random-number-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-number-service
  namespace: microservices-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: random-number-service
  template:
    metadata:
      labels:
        app: random-number-service
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.3.1
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: mappings
              mountPath: /home/wiremock/mappings
      volumes:
        - name: mappings
          configMap:
            name: wiremock-mappings